<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <!-- 배경 (흰색) -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  
  <defs>
    <!-- 카드 기본 형태 정의 (녹색 테두리, 연두색 배경, 하단 곡선) -->
    <path id="card" 
          d="M 0 0 L 760 0 L 760 380 C 475 450, 190 510, 0 480 Z" 
          fill="#DEF2D9" 
          stroke="#099A46" 
          stroke-width="24" 
          stroke-linejoin="round" />
  </defs>

  <!-- 1. 뒷면 카드 -->
  <use href="#card" x="160" y="40" />
  
  <!-- 2. 중간 카드 -->
  <use href="#card" x="105" y="90" />
  
  <!-- 3. 전면 카드 -->
  <use href="#card" x="50" y="140" />

  <!-- 전면 카드 위의 푸른색 심볼 로고 -->
  <g transform="translate(50, 140)" fill="#5A9BD5">
    
    <!-- 상단 좌측 큰 점 -->
    <circle cx="110" cy="120" r="22" />
    
    <!-- 하단 좌측 작은 점 -->
    <circle cx="80" cy="205" r="10" />
    
    <!-- 좌측 메인 기둥 (수직 베지어 곡선) -->
    <path d="M 160 80 
             C 210 65, 220 85, 220 125 
             L 220 395 
             C 220 465, 140 485, 95 455 
             C 65 435, 60 390, 85 340 
             C 115 285, 145 230, 150 170 
             C 155 125, 145 95, 160 80 Z" />
             
    <!-- 우측 상단 반원(돔) 형태 -->
    <path d="M 220 285 
             L 520 285 
             C 510 140, 390 70, 300 100 
             C 250 115, 220 160, 220 200 Z" />
             
    <!-- 우측 하단 중앙 삼각형(웨지) -->
    <path d="M 220 305 
             L 480 305 
             L 220 410 Z" />
             
    <!-- 우측 하단 끝단 독립된 역삼각형 -->
    <path d="M 510 305 
             L 600 305 
             L 555 405 Z" />
  </g>
</svg>
