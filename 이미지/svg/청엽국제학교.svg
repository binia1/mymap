<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 프리미엄 골드 그라데이션 -->
    <linearGradient id="goldGradientIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA801E"/>
      <stop offset="100%" stop-color="#664D00"/>
    </linearGradient>

    <!-- 내측 골드 선 그라데이션 -->
    <linearGradient id="flatGoldIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6C27A" />
      <stop offset="100%" stop-color="#997A00" />
    </linearGradient>
  </defs>

  <!-- 바탕 원형 뱃지 (로열 네이비) & 외곽 골드 테두리 -->
  <circle cx="100" cy="100" r="88" fill="#001F3F" stroke="url(#goldGradientIcon)" stroke-width="8" />
  
  <!-- 내부 장식 얇은 골드 선 -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#flatGoldIcon)" stroke-width="1.5" opacity="0.7" />

  <!-- 중앙 CIS 약칭 모노그램 -->
  <text x="100" y="122" font-family="'Times New Roman', 'Georgia', 'Noto Serif', serif" font-weight="bold" font-size="64" fill="url(#goldGradientIcon)" text-anchor="middle" letter-spacing="2">CIS</text>
</svg>
