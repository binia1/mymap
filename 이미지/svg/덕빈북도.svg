<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
    <defs>
        <!-- 왼쪽 주황색 손 (어색했던 형태를 버리고 둥글고 부드러운 곡선으로 완벽히 재구현) -->
        <path id="hand" d="M 125 30 
                 C 155 25, 175 55, 185 95 
                 L 195 155 
                 C 200 185, 165 200, 145 185 
                 C 135 175, 125 165, 125 165 
                 L 105 180 
                 C 90 190, 80 175, 90 160 
                 L 115 130 
                 L 100 70 
                 C 95 40, 105 35, 125 30 Z" />
    </defs>

    <!-- 1. 양손 (주황색) -->
    <g fill="#f08b3a">
        <use href="#hand" />
        <!-- 우측 손은 좌측 손을 정확히 대칭 복사 -->
        <use href="#hand" transform="scale(-1, 1) translate(-400, 0)" />
    </g>

    <!-- 2. 중앙 3개의 빛/다이아몬드 (연하늘색) -->
    <g fill="#abc7f2">
        <!-- 중앙 수직 다이아몬드 -->
        <polygon points="200,180 215,215 200,245 185,215" />
        <!-- 좌측 기울어진 다이아몬드 -->
        <polygon points="120,230 155,235 145,265 110,260" />
        <!-- 우측 기울어진 다이아몬드 (좌측 대칭) -->
        <polygon points="280,230 245,235 255,265 290,260" />
    </g>

    <!-- 3. 덕북 텍스트 (원본의 두껍고 둥글둥글한 느낌 구현) -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- '덕' (민트색) -->
        <g stroke="#12c7b5" stroke-width="18">
            <!-- ㄷ -->
            <path d="M 130 310 L 70 310 L 70 370 L 130 370" />
            <!-- ㅓ -->
            <path d="M 145 340 L 170 340 M 170 300 L 170 380" />
            <!-- ㄱ (받침) -->
            <path d="M 75 420 L 160 420 L 160 460" />
        </g>

        <!-- '북' (파란색) -->
        <g stroke="#339eeb" stroke-width="18">
            <!-- ㅂ -->
            <path d="M 240 300 L 240 365 
                     M 295 300 L 295 365 
                     M 240 332 L 295 332 
                     M 240 365 L 295 365" />
            <!-- ㅜ -->
            <path d="M 225 405 L 310 405 
                     M 267 405 L 267 430" />
            <!-- ㄱ (받침) -->
            <path d="M 235 465 L 300 465 L 300 490" />
        </g>
    </g>
</svg>
