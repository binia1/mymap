<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .metro-text-chang {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 46px; /* 한글 '창' 자가 링 안에 예쁘게 여백을 두고 들어가도록 크기 조절 */
        fill: #33AAFF; /* 창전선 공식 하늘색 */
      }
    </style>
  </defs>

  <!-- 창전선 하늘색 링 -->
  <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#33AAFF" stroke-width="10"/>

  <!-- 아래로 쏠리지 않도록 y좌표를 67로 강제 고정하여 정중앙에 배치 -->
  <text x="50" y="67" class="metro-text-chang" text-anchor="middle">창</text>
</svg>
