<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- 물방울 모양을 클리핑 마스크로 정의하여 내부 요소들이 밖으로 삐져나가지 않도록 설정 -->
    <clipPath id="dropClip">
      <path d="M 100 20 C 100 20 175 100 175 150 A 75 75 0 0 1 25 150 C 25 100 100 20 100 20 Z" />
    </clipPath>
  </defs>

  <!-- 물방울 배경 윗부분 (밝은 청록색) -->
  <rect x="0" y="0" width="200" height="240" fill="#4B9CB8" clip-path="url(#dropClip)" />

  <!-- 물방울 배경 아랫부분 물결 (진한 청록색) -->
  <path d="M 0 145 C 50 145 60 175 100 175 C 140 175 160 145 200 145 L 200 240 L 0 240 Z" fill="#299CA4" clip-path="url(#dropClip)" />

  <!-- 중앙의 짙은 파란색 식물 -->
  <g fill="#1A5A90" clip-path="url(#dropClip)">
    <!-- 줄기: 윗부분은 둥글게, 아랫부분은 물결에 맞춰 자연스러운 사선 처리 -->
    <path d="M 94 70 C 94 64 106 64 106 70 L 106 167 L 94 163 Z" />
    
    <!-- 왼쪽 잎 -->
    <path d="M 94 105 Q 70 88 54 93 Q 66 125 94 122 Z" />
    
    <!-- 오른쪽 위 잎 -->
    <path d="M 106 92 Q 130 82 142 84 Q 138 106 106 108 Z" />
    
    <!-- 오른쪽 아래 잎 -->
    <path d="M 106 128 Q 130 118 142 120 Q 138 142 106 144 Z" />
  </g>
</svg>
