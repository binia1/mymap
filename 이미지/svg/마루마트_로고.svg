<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- 배경 (깔끔한 화이트톤 캔버스) -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- 미니멀리즘 마루(하나마루) 심볼 -->
  <g transform="translate(45, 25)">
    <!-- 기하학적 꽃잎 모양의 심플한 마크 -->
    <ellipse cx="35" cy="35" rx="30" ry="12" fill="#FFC107" transform="rotate(0 35 35)" />
    <ellipse cx="35" cy="35" rx="30" ry="12" fill="#FF9800" transform="rotate(45 35 35)" />
    <ellipse cx="35" cy="35" rx="30" ry="12" fill="#FFC107" transform="rotate(90 35 35)" />
    <ellipse cx="35" cy="35" rx="30" ry="12" fill="#FF9800" transform="rotate(135 35 35)" />
    
    <!-- 중앙 코어 -->
    <circle cx="35" cy="35" r="10" fill="#ffffff" />
    <circle cx="35" cy="35" r="5" fill="#E65100" />
  </g>

  <!-- 우측 텍스트 영역 (한글 중심, 심플한 기업형 폰트) -->
  <g transform="translate(155, 0)">
    <!-- 메인 브랜드 네임 (한글) -->
    <text x="0" y="73" font-family="'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" font-size="54" font-weight="900" fill="#FF9800" letter-spacing="-3">마루마트</text>
    
    <!-- 서브 카테고리 텍스트 -->
    <text x="5" y="96" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#888888" letter-spacing="4">MEGA &amp; ZURA RETAIL</text>
  </g>
</svg>
