<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- 학생과 열정을 상징하는 머리/태양 부분 -->
  <circle cx="100" cy="40" r="18" fill="#FF5522" />

  <!-- 지식의 책과 비상하는 날개를 형상화한 좌측 잎 (파란색) -->
  <path d="M 96 75 Q 40 70 20 125 Q 60 115 96 148 Z" fill="#0077DD" />

  <!-- 미래와 성장을 상징하는 우측 잎 (초록색) -->
  <path d="M 104 75 Q 160 70 180 125 Q 140 115 104 148 Z" fill="#00CCAA" />

  <!-- 학생들을 든든하게 받쳐주는 기반이자 교육의 물결 (코레일 블루) -->
  <path d="M 30 155 Q 100 195 170 155 Q 100 175 30 155 Z" fill="#005BAC" />
</svg>
