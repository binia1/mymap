<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 1. 단말기 외곽선을 따라 배경의 믹스커피 스틱을 깔끔하게 파내는 투명 갭 마스크 -->
    <mask id="terminalGapMask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 단말기 본체 + 영수증 영역을 5px 두께의 검은색 테두리로 뚫어내어 완벽한 여백 형성 -->
      <rect x="36" y="30" width="28" height="46" rx="4" fill="black" stroke="black" stroke-width="5" />
      <path d="M 39,14 L 42,17 L 45,14 L 48,17 L 51,14 L 54,17 L 57,14 L 60,17 L 61,14 L 61,30 L 39,30 Z" fill="black" stroke="black" stroke-width="5" />
    </mask>
    
    <!-- 2. 결제 단말기 고유의 액정 화면, 키패드, IC카드 슬롯을 정밀 타공하기 위한 음각 마스크 -->
    <mask id="terminalDetailMask">
      <rect x="0" y="0" width="100" height="100" fill="white" />
      <!-- 상단 액정 화면 영역 컷아웃 (이 공간을 통해 내부의 퇴근 시계가 보임) -->
      <rect x="41" y="35" width="18" height="12" rx="1" fill="black" />
      
      <!-- 정밀하게 배치된 자본주의의 3x3 키패드 버튼 버튼들 -->
      <circle cx="45" cy="54" r="1.3" fill="black" />
      <circle cx="50" cy="54" r="1.3" fill="black" />
      <circle cx="55" cy="54" r="1.3" fill="black" />
      <circle cx="45" cy="60" r="1.3" fill="black" />
      <circle cx="50" cy="60" r="1.3" fill="black" />
      <circle cx="55" cy="60" r="1.3" fill="black" />
      <circle cx="45" cy="66" r="1.3" fill="black" />
      <circle cx="50" cy="66" r="1.3" fill="black" />
      <circle cx="55" cy="66" r="1.3" fill="black" />
      
      <!-- 하단 IC 카드 투입구 슬롯 -->
      <line x1="43" y1="71.5" x2="57" y2="71.5" stroke="black" stroke-width="1.8" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- [레이어 1] 배경: 생존을 위해 원샷하는 모카골드 믹스커피 2봉지 (X자 교차, 갭 마스크 적용) -->
  <g transform="translate(50,53)" mask="url(#terminalGapMask)">
    <!-- 믹스커피 스틱 1 (우상향) -->
    <g transform="rotate(45)">
      <rect x="-5.5" y="-35" width="11" height="70" rx="2" fill="#CFBA0F" />
    </g>
    <!-- 믹스커피 스틱 2 (좌상향) -->
    <g transform="rotate(-45)">
      <rect x="-5.5" y="-35" width="11" height="70" rx="2" fill="#CFBA0F" />
    </g>
  </g>

  <!-- [레이어 2] 전면: 퀵드로우의 달인이 쥐고 있는 이동식 결제 단말기 본체 -->
  <!-- 찌리리릭 뽑혀 나오는 지그재그 영수증 종이 -->
  <path d="M 39,14 L 42,17 L 45,14 L 48,17 L 51,14 L 54,17 L 57,14 L 60,17 L 61,14 L 61,30 L 39,30 Z" fill="#CFBA0F" />
  <!-- 단말기 메인 바디 (화면 및 버튼 음각 마스크 적용) -->
  <rect x="36" y="30" width="28" height="46" rx="4" fill="#CFBA0F" mask="url(#terminalDetailMask)" />

  <!-- [레이어 3] 심볼의 핵심: 뚫려 있는 결제창 너머로 선명하게 비치는 정각 6시(퇴근) 시계 -->
  <circle cx="50" cy="41" r="4.2" fill="none" stroke="#CFBA0F" stroke-width="1.5" />
  <polyline points="50,38.5 50,41 50,43.5" fill="none" stroke="#CFBA0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
