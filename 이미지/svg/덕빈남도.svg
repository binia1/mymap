<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
    <defs>
        <!-- 전체 로고를 완벽한 원형으로 잘라주는 마스크 -->
        <clipPath id="circleClip">
            <circle cx="150" cy="150" r="140" />
        </clipPath>
    </defs>
    
    <!-- clip-path를 적용하여 원 안쪽에만 색상이 칠해지도록 설정 -->
    <g clip-path="url(#circleClip)">
        
        <!-- 1. 상단 노란색 (태양/하늘) -->
        <path d="M -10 -10 
                 L 310 -10 
                 L 310 145 
                 Q 265 130 220 125 
                 C 195 125, 175 90, 140 90 
                 C 105 90, 95 135, 70 135 
                 Q 30 135 -10 145 
                 Z" 
              fill="#FFC812" />

        <!-- 2. 중앙 파란색 (물결 및 산봉우리) -->
        <path d="M -10 165
                 C 30 155, 60 160, 90 170
                 C 120 180, 145 195, 165 195
                 C 195 195, 205 145, 240 145
                 C 270 145, 290 160, 310 175
                 L 310 225
                 C 260 240, 210 255, 150 255
                 C 90 255, 40 235, -10 215
                 Z"
              fill="#1773A6" />

        <!-- 3. 하단 주황색 (땅/모래사장) -->
        <path d="M -10 235
                 C 40 255, 90 272, 150 272
                 C 200 272, 240 260, 280 245
                 L 280 320
                 L -10 320
                 Z"
              fill="#F58723" />
              
    </g>
</svg>
