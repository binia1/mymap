    <!-- 좌상단: 코랄 핑크 -->
    <circle cx="505" cy="235" r="95" fill="#F17486"/>
    
    <!-- 우상단: 아쿠아 민트 -->
    <circle cx="740" cy="235" r="95" fill="#67E3C4"/>
    
    <!-- 좌하단: 아쿠아 민트 -->
    <circle cx="505" cy="510" r="95" fill="#67E3C4"/>
    
    <!-- 우하단: 코랄 핑크 -->
