<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="100%" height="100%">
  <!-- 배경 (흰색) -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  
  <!-- 상단 보라색 반원(아치) 도형 -->
  <!-- 외부 반지름: 125, 내부 반지름: 60, 두께: 65 -->
  <path d="M 125 250 
           A 125 125 0 0 1 375 250 
           L 310 250 
           A 60 60 0 0 0 190 250 Z" 
        fill="#A3289E" />
  
  <!-- 중단 황금색 역삼각형 -->
  <!-- 아치와의 여백(20px)을 두고 평행하게 배치 -->
  <path d="M 50 270 
           L 450 270 
           L 250 470 Z" 
        fill="#DCA004" />
  
  <!-- 하단 텍스트 -->
  <text x="250" y="610" 
        font-family="'Batang', 'Gungsuh', 'Noto Serif KR', serif" 
        font-size="115" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#111111" 
        letter-spacing="12">선곡군</text>
</svg>
