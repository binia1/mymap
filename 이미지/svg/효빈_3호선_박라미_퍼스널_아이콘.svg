<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <!-- 투명한 여백(Negative Space)을 뚫기 위한 마스크 설정 -->
    <mask id="cameraCutout">
      <!-- 기본 배경(흰색)은 도형을 그대로 렌더링함 -->
      <rect x="0" y="0" width="100" height="100" fill="white" />
      
      <!-- 렌즈 안쪽을 뚫기 위한 검은색 원 (투명하게 처리됨) -->
      <circle cx="50" cy="55" r="16" fill="black" />
      
      <!-- 검은색으로 뚫린 렌즈 공간 안에 'F'를 하얀색(보이게)으로 그려 넣음 -->
      <!-- 'F는 Framing의 F'라는 그녀의 감성을 상징 -->
      <path d="M 45 47 L 55 47 M 45 47 L 45 63 M 45 55 L 52 55" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" stroke-linejoin="round"/>
      
      <!-- 카메라 상단 플래시 영역 뚫기 -->
      <rect x="42" y="24" width="16" height="4" rx="1.5" fill="black" />
      
      <!-- 우측 상단 뷰파인더/센서 영역 뚫기 -->
      <circle cx="75" cy="42" r="3" fill="black" />
    </mask>
  </defs>

  <!-- 카메라 바디 (마스크 적용) -->
  <rect x="15" y="32" width="70" height="50" rx="6" fill="#FFCC11" mask="url(#cameraCutout)" />
  
  <!-- 카메라 상단 돌출부(플래시 마운트 부분) (마스크 적용) -->
  <path d="M 32 32 L 38 20 Q 40 18 42 18 L 58 18 Q 60 18 62 20 L 68 32 Z" fill="#FFCC11" mask="url(#cameraCutout)" />

  <!-- 왼쪽 셔터 버튼 -->
  <rect x="22" y="26" width="12" height="6" rx="2" fill="#FFCC11" />
  
  <!-- 렌즈 바깥쪽 테두리 링 (마스크 바깥에 독립적으로 렌더링) -->
  <circle cx="50" cy="55" r="22" fill="none" stroke="#FFCC11" stroke-width="4" />
</svg>
