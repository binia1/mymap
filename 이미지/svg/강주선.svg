<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .metro-text-solid {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 42px; /* 두 글자가 꽉 차게 들어가도록 크기 조절 */
        letter-spacing: -2px; /* 둥근 배경 안에 잘 들어맞도록 자간 축소 */
        fill: #ffffff; /* 흰색 글씨 */
      }
    </style>
  </defs>

  <!-- 첨부 이미지와 동일한 꽉 찬 코레일 블루 원형 배경 -->
  <!-- 빈효선 광역전철의 공동 상징색이기도 한 코레일 블루(#005BAC)를 적용했습니다. -->
  <circle cx="50" cy="50" r="50" fill="#959595"/>

  <!-- 아래로 쏠리지 않도록 y좌표를 66으로 강제 고정하여 정중앙에 배치 -->
  <text x="50" y="66" class="metro-text-solid" text-anchor="middle">강주</text>
</svg>
