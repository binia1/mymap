<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .metro-text-bin {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 46px; /* 한글 '빈' 자가 링 안에 예쁘게 여백을 두고 들어가도록 크기 조절 */
        fill: #6677CC; /* 빈효선 공식 연청색 */
      }
    </style>
  </defs>

  <!-- 빈효선 연청색 링 -->
  <!-- CSS border: 5px solid 비율에 맞춘 굵은 테두리와 흰색 배경 -->
  <circle cx="50" cy="50" r="42" fill="#ffffff" stroke="#6677CC" stroke-width="10"/>

  <!-- 아래로 쏠리지 않도록 y좌표를 67로 강제 고정하여 정중앙에 배치 -->
  <text x="50" y="67" class="metro-text-bin" text-anchor="middle">빈</text>
</svg>
