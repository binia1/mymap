<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">
  <defs>
    <!-- 깔끔하고 굵은 Noto Sans KR 폰트 적용 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&amp;display=swap');
      .metro-text-7 {
        font-family: 'Noto Sans KR', sans-serif;
        font-weight: 900;
        font-size: 55px;
        fill: #FF8899; /* 7호선 공식 분홍색 */
      }
    </style>
  </defs>

  <!-- 7호선 분홍색 사각형 테두리 -->
  <!-- x, y 좌표와 width, height를 조정해 기존 링과 동일한 굵기/비율을 유지하며, 모서리를 살짝 둥글게(rx="10") 처리했습니다. -->
  <rect x="8" y="8" width="84" height="84" rx="10" ry="10" fill="#ffffff" stroke="#FF8899" stroke-width="10"/>

  <!-- 아래로 쏠리지 않도록 y좌표를 69로 강제 고정하여 정중앙에 배치 -->
  <text x="50" y="69" class="metro-text-7" text-anchor="middle">7</text>
</svg>
