<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <!-- 배경 (흰색) -->
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- 파란색 한자(氣) 뼈대 스트로크 -->
  <g fill="none" stroke="#187bf5" stroke-width="75" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. 맨 위 왼쪽으로 삐치는 획 (丿) -->
    <path d="M 310 70 C 270 140, 180 260, 70 350" />
    
    <!-- 2. 첫 번째 가로획 (一) -->
    <path d="M 290 165 L 680 150" />
    
    <!-- 3. 두 번째 가로획 (一) -->
    <path d="M 320 305 L 640 295" />
    
    <!-- 4. 크게 감싸며 오른쪽 아래로 꺾이는 획 (⺄) -->
    <path d="M 190 450 L 610 440 C 690 435, 710 460, 715 540 C 720 620, 740 700, 740 730 C 740 780, 780 820, 840 770" />
    
    <!-- 5. 안쪽 쌀 미(米) - 세로 굽은 획 -->
    <path d="M 435 480 Q 420 680 395 880" />
    
    <!-- 6. 안쪽 쌀 미(米) - 가로획 -->
    <path d="M 170 630 L 590 615" />
    
    <!-- 7. 안쪽 쌀 미(米) - 좌측 상단 점 -->
    <path d="M 260 540 L 340 580" />
    
    <!-- 8. 안쪽 쌀 미(米) - 우측 상단 점 -->
    <path d="M 560 520 L 480 560" />
    
    <!-- 9. 안쪽 쌀 미(米) - 좌측 하단 삐침 -->
    <path d="M 405 650 Q 330 740 220 830" />
    
    <!-- 10. 안쪽 쌀 미(米) - 우측 하단 삐침 -->
    <path d="M 425 640 Q 510 730 600 810" />
    
  </g>

  <!-- 우측 상단 노란색 루프(나뭇잎) 포인트 -->
  <path d="M 740 310 C 760 200, 830 140, 910 140 C 890 220, 820 300, 740 310 Z" fill="none" stroke="#f7ce00" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" />
  
</svg>
