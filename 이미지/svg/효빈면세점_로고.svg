<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- 럭셔리 샴페인 골드 그라데이션 -->
    <linearGradient id="luxuryGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="40%" stop-color="#FDF5D3"/>
      <stop offset="60%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    
    <!-- 프리미엄 딥 네이비 -->
    <linearGradient id="deepNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#112240"/>
    </linearGradient>
  </defs>

  <!-- 좌측 엠블럼 영역 -->
  <g transform="translate(20, 20)">
    <!-- 외부 클래식 링 -->
    <circle cx="60" cy="60" r="50" fill="none" stroke="url(#luxuryGold)" stroke-width="2" />
    <circle cx="60" cy="60" r="42" fill="none" stroke="url(#luxuryGold)" stroke-width="1" opacity="0.6" />
    
    <!-- 이니셜 'H' 모노그램 -->
    <path d="M 45 40 L 45 80 M 75 40 L 75 80 M 45 60 L 75 60" stroke="url(#luxuryGold)" stroke-width="5" stroke-linecap="square"/>
    
    <!-- 엠블럼 상단의 프리미엄 스타 (반짝임) -->
    <path d="M 60 -5 Q 60 12 75 12 Q 60 12 60 29 Q 60 12 45 12 Q 60 12 60 -5 Z" fill="url(#luxuryGold)"/>
  </g>

  <!-- 메인 영문 브랜드명 -->
  <text x="160" y="70" font-family="'Didot', 'Times New Roman', 'Georgia', serif" font-size="46" font-weight="bold" fill="url(#deepNavy)" letter-spacing="8">
    HYOBIN
  </text>
  
  <!-- 서브 영문 (DUTY FREE) -->
  <text x="165" y="105" font-family="'Arial', 'Helvetica', sans-serif" font-size="18" font-weight="600" fill="url(#luxuryGold)" letter-spacing="14">
    DUTY FREE
  </text>

  <!-- 한글 브랜드명 -->
  <text x="165" y="135" font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" font-size="16" font-weight="500" fill="#666666" letter-spacing="6">
    효빈면세점
  </text>

  <!-- 우측 하단 미니멀 데코 라인 -->
  <line x1="450" y1="130" x2="560" y2="130" stroke="url(#luxuryGold)" stroke-width="1" opacity="0.7" />
  <circle cx="560" cy="130" r="2" fill="url(#luxuryGold)" />
</svg>
