<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <!-- 배경 (깔끔한 화이트톤 캔버스) -->
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- 미니멀리즘 나비 심볼 (빈 마르가레테/초지관철 상징) -->
  <g transform="translate(35, 25)">
    <!-- 왼쪽 상단 날개 -->
    <ellipse cx="22" cy="22" rx="22" ry="15" fill="#e49dfd" transform="rotate(-40 22 22)" />
    <!-- 오른쪽 상단 날개 -->
    <ellipse cx="58" cy="22" rx="22" ry="15" fill="#c14ee0" transform="rotate(40 58 22)" />
    
    <!-- 왼쪽 하단 날개 -->
    <ellipse cx="27" cy="48" rx="16" ry="12" fill="#c14ee0" transform="rotate(40 27 48)" />
    <!-- 오른쪽 하단 날개 -->
    <ellipse cx="53" cy="48" rx="16" ry="12" fill="#8a119c" transform="rotate(-40 53 48)" />
    
    <!-- 나비 몸통 (직선형으로 심플하게) -->
    <rect x="37" y="10" width="6" height="45" rx="3" fill="#4a0b59" />
  </g>

  <!-- 우측 텍스트 영역 (영문 전용, 심플하고 굵은 기업형 폰트) -->
  <g transform="translate(135, 0)">
    <!-- 메인 브랜드 네임 -->
    <text x="0" y="70" font-family="'Arial Black', 'Impact', sans-serif" font-size="52" font-weight="900" fill="#4a0b59" letter-spacing="-1">BINS MART</text>
    
    <!-- 서브 브랜드/슬로건 텍스트 -->
    <text x="5" y="92" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#c14ee0" letter-spacing="4">EDELSTEIN SUPERMARKET</text>
  </g>
</svg>
