<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="100%" height="100%">
  <!-- 외각 테두리 (연한 파스텔 하늘색) -->
  <path d="M 40 30 
           L 360 30 
           L 360 420 
           L 200 530 
           L 40 420 Z" 
        fill="#E5F2FC" 
        stroke="#E5F2FC" 
        stroke-width="20" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- 내부 방패 (바탕 파란색) -->
  <path d="M 55 45 
           L 345 45 
           L 345 410 
           L 200 510 
           L 55 410 Z" 
        fill="#9ECBEF" 
        stroke="#9ECBEF" 
        stroke-width="10" 
        stroke-linejoin="round" 
        stroke-linecap="round" />

  <!-- 중앙 동심원 문양 (선명한 하늘색) -->
  <g fill="none" stroke="#36A2DF" stroke-width="22">
    <!-- 바깥쪽 원 -->
    <circle cx="200" cy="265" r="95" />
    <!-- 안쪽 원 -->
    <circle cx="200" cy="265" r="48" />
  </g>
</svg>
