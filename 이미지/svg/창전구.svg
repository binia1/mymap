<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- 중앙 및 날개 바탕 그래디언트 (스카이 블루) -->
    <linearGradient id="mainBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C3FF" />
      <stop offset="100%" stop-color="#008BE3" />
    </linearGradient>

    <!-- 날개 끝부분 음영 그래디언트 (딥 블루) -->
    <linearGradient id="tipBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008BE3" />
      <stop offset="100%" stop-color="#0052C2" />
    </linearGradient>
  </defs>

  <!-- 1. 중앙 및 날개 전체 통합 메인 바디 -->
  <path d="M 190 185
           C 160 120, 165 70, 195 30
           C 225 70, 220 120, 215 165
           C 260 130, 310 120, 365 145
           C 320 180, 265 195, 205 205
           C 170 245, 125 295, 75 345
           C 95 285, 125 240, 160 195
           C 115 160, 75 145, 40 125
           C 85 125, 140 145, 190 185 Z"
        fill="url(#mainBlue)" />

  <!-- 2. 각 날개 끝부분 딥 블루 포인트 캡 -->
  <!-- 상단 날개 끝 -->
  <path d="M 178 62 C 185 48, 190 38, 195 30 C 200 38, 205 48, 212 62 C 200 66, 190 66, 178 62 Z" fill="url(#tipBlue)" />
  <!-- 우측 날개 끝 -->
  <path d="M 328 136 C 342 139, 355 142, 365 145 C 352 155, 338 163, 322 169 C 322 155, 324 144, 328 136 Z" fill="url(#tipBlue)" />
  <!-- 좌하단 날개 끝 -->
  <path d="M 102 318 C 90 330, 80 340, 75 345 C 85 328, 98 308, 110 292 C 112 302, 108 311, 102 318 Z" fill="url(#tipBlue)" />
  <!-- 좌측 날개 끝 -->
  <path d="M 72 128 C 58 126, 48 125, 40 125 C 52 128, 66 134, 78 141 C 74 135, 72 131, 72 128 Z" fill="url(#tipBlue)" />

  <!-- 3. 날개 끝 흰색 포인트 곡선 띠 (White Accent Lines) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <!-- 상단 날개 띠 -->
    <path d="M 175 66 Q 195 72 215 66" />
    <!-- 우측 날개 띠 -->
    <path d="M 324 134 Q 326 153 320 171" />
    <!-- 좌하단 날개 띠 -->
    <path d="M 112 290 Q 106 305 100 321" />
    <!-- 좌측 날개 띠 -->
    <path d="M 70 126 Q 74 134 78 143" />
  </g>
</svg>
